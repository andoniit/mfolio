name: MfolioAdmin
options:
  bundleIdPrefix: com.anirudha
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  MfolioAdmin:
    type: application
    platform: iOS
    sources:
      # The .icon bundle is a directory, but Xcode must see it as one item —
      # left to recurse, XcodeGen would add icon.json and the SVG separately
      # and the icon would never be built.
      - path: MfolioAdmin
        excludes:
          - "AppIcon.icon"
          - "AppIcon.icon/**"
      - path: MfolioAdmin/AppIcon.icon
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anirudha.mfolioadmin
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: Mfolio
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MfolioAdmin/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: VG2N3XUNXB
        ENABLE_USER_SCRIPT_SANDBOXING: NO
