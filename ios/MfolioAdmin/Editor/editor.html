<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- No zoom: this is an editing surface inside a native screen, not a page. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- Nothing here may reach the network; images come in as URLs the app already uploaded. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src https: data: blob:;">
<title>Post body</title>
<style>
  :root {
    color-scheme: light dark;
    --text: #1c1c1e;
    --muted: #8e8e93;
    --rule: rgba(60, 60, 67, 0.18);
    --tint: #007aff;
    --code-bg: rgba(118, 118, 128, 0.12);
    --quote: rgba(60, 60, 67, 0.3);
    --mark: #fff3a3;
    --mark-text: #1c1c1e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text: #f2f2f7;
      --muted: #8e8e93;
      --rule: rgba(84, 84, 88, 0.6);
      --tint: #0a84ff;
      --code-bg: rgba(118, 118, 128, 0.24);
      --quote: rgba(235, 235, 245, 0.3);
      --mark: #6b5d12;
      --mark-text: #f2f2f7;
    }
  }

  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    -webkit-text-size-adjust: 100%;
  }
  body {
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
    overflow-wrap: break-word;
  }

  /* The whole viewport is the editor, so a tap below the last line still
     lands in it rather than on dead page. */
  .ProseMirror {
    min-height: calc(100vh - 32px);
    padding: 12px 16px 120px;
    outline: none;
    caret-color: var(--tint);
    white-space: pre-wrap;
  }
  .ProseMirror > * + * { margin-top: 0.75em; }
  .ProseMirror p { margin: 0; }
  .ProseMirror p + p { margin-top: 0.75em; }

  .ProseMirror p.is-editor-empty:first-child::before {
    content: attr(data-placeholder);
    color: var(--muted);
    float: left;
    height: 0;
    pointer-events: none;
  }

  .ProseMirror h1, .ProseMirror h2, .ProseMirror h3, .ProseMirror h4 {
    line-height: 1.25;
    margin: 1.2em 0 0.4em;
    font-weight: 700;
  }
  .ProseMirror h1 { font-size: 1.6em; }
  .ProseMirror h2 { font-size: 1.35em; }
  .ProseMirror h3 { font-size: 1.15em; }
  .ProseMirror h4 { font-size: 1em; }
  .ProseMirror > :first-child { margin-top: 0; }

  .ProseMirror a { color: var(--tint); text-decoration: underline; }

  .ProseMirror mark {
    background: var(--mark);
    color: var(--mark-text);
    border-radius: 3px;
    padding: 0 2px;
  }

  .ProseMirror code {
    font: 0.88em/1.4 ui-monospace, "SF Mono", Menlo, monospace;
    background: var(--code-bg);
    border-radius: 5px;
    padding: 0.1em 0.35em;
  }
  .ProseMirror pre {
    background: var(--code-bg);
    border-radius: 10px;
    padding: 12px 14px;
    overflow-x: auto;
    white-space: pre;
  }
  .ProseMirror pre code { background: none; padding: 0; font-size: 0.85em; }

  .ProseMirror blockquote {
    margin-left: 0;
    padding-left: 14px;
    border-left: 3px solid var(--quote);
    color: var(--muted);
  }

  .ProseMirror ul, .ProseMirror ol { padding-left: 1.4em; }
  .ProseMirror li > p { margin: 0; }
  .ProseMirror li + li { margin-top: 0.25em; }

  .ProseMirror ul[data-type="taskList"] { list-style: none; padding-left: 0.2em; }
  .ProseMirror ul[data-type="taskList"] li { display: flex; gap: 0.5em; align-items: flex-start; }
  .ProseMirror ul[data-type="taskList"] li > label { flex: 0 0 auto; margin-top: 0.2em; }
  .ProseMirror ul[data-type="taskList"] li > div { flex: 1 1 auto; }
  .ProseMirror ul[data-type="taskList"] input { width: 18px; height: 18px; accent-color: var(--tint); }
  .ProseMirror ul[data-type="taskList"] li[data-checked="true"] > div { color: var(--muted); text-decoration: line-through; }

  .ProseMirror div[data-type="horizontalRule"] { padding: 0.5em 0; }
  .ProseMirror hr { border: 0; border-top: 1px solid var(--rule); margin: 0; }

  .ProseMirror img {
    display: block;
    max-width: 100%;
    height: auto;
    border-radius: 10px;
  }
  .ProseMirror img.ProseMirror-selectednode,
  .ProseMirror div[data-type="horizontalRule"].ProseMirror-selectednode hr {
    outline: 3px solid var(--tint);
    outline-offset: 2px;
  }
</style>
</head>
<body>
<div id="editor"></div>
<script src="editor.bundle.js"></script>
</body>
</html>
